[package]
name = "smartnet-seeder"
version = "1.4.0"
edition = "2021"
description = "SmartNet headless P2P seeder — keep dApps alive 24/7 from a cheap VPS (no GUI)."

[[bin]]
name = "smartnet-seeder"
path = "src/main.rs"

[dependencies]
# --- P2P blob transit (must match the desktop client EXACTLY for interop) ---
iroh = "1"
iroh-blobs = "0.103"
iroh-mdns-address-lookup = "0.4"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

# --- HTTP tracker client (blocking; run via spawn_blocking) ---
ureq = { version = "2", features = ["tls"] }

# --- config + (de)serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- SmartHoldem reward-address derivation (same scheme as the wallet) ---
secp256k1 = { version = "0.29", features = ["std"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
base64 = "0.22"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh-mainline-address-lookup = "0.4"
n0-mainline = "0.5"
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
